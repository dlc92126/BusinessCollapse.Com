<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="keywords" content="bankruptcy tracker, corporate graveyard, Chapter 11 filings, Section 363 auctions, PACER bankruptcy dockets, corporate collapse, distress index, WeWork bankruptcy, Spirit Airlines Chapter 11, Tupperware bankruptcy" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <!-- AI SEO & Search Engine JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://businesscollapse.com/#organization",
          "name": "BusinessCollapse.com",
          "url": "https://businesscollapse.com",
          "logo": "https://businesscollapse.com/favicon.svg",
          "description": "Autonomous AI Corporate Distress Tracking & Bankruptcy Intelligence Network",
          "foundingDate": "2024",
          "knowsAbout": ["Chapter 11 Bankruptcy", "Section 363 Liquidation Auctions", "PACER Court Filings", "Corporate Distress Risk"]
        },
        {
          "@type": "Dataset",
          "@id": "https://businesscollapse.com/#dataset",
          "name": "Corporate Graveyard & Bankruptcy Docket Index",
          "description": "Comprehensive structured database of corporate Chapter 11 bankruptcy filings, Section 363 asset liquidation auctions, and failure timelines.",
          "url": "https://businesscollapse.com/#graveyard",
          "license": "https://businesscollapse.com/terms",
          "isAccessibleForFree": true,
          "creator": {
            "@id": "https://businesscollapse.com/#organization"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://businesscollapse.com/#website",
          "url": "https://businesscollapse.com",
          "name": "BusinessCollapse.com",
          "publisher": {
            "@id": "https://businesscollapse.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://businesscollapse.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden Netlify Forms detector for SPA automatic form handling & email notifications -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="category"></select>
      <textarea name="message"></textarea>
    </form>

    <form name="auction-credentials" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="subscriber_name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="auction_title" />
      <input type="text" name="ticker" />
      <input type="text" name="pin" />
      <input type="text" name="bidder_id" />
      <input type="text" name="online_portal_url" />
    </form>

    <form name="vip-onboarding" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="full_name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="organization" />
      <input type="text" name="role" />
      <input type="text" name="tier" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
